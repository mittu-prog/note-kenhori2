    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #222222;
            --muted: #666666;
            --border: #e5e7eb;
            --accent: #2cb696;
            --link: #0066cc;
            --quote-bg: #f3f4f6;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --card-bg: #1e1e1e;
                --text: #e5e7eb;
                --muted: #9ca3af;
                --border: #374151;
                --accent: #2cb696;
                --link: #60a5fa;
                --quote-bg: #262626;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            line-height: 1.85;
            font-size: 17px;

        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 20px 16px 64px;
        }
        .top-bar {
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .top-bar a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .top-bar a:hover { text-decoration: underline; }
        article {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px 36px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        @media (max-width: 600px) {
            article { padding: 20px 16px; }

        .eyecatch {
            margin: -32px -36px 24px -36px;
            border-radius: 12px 12px 0 0;

        .eyecatch img {
            width: 100%;
            height: auto;
            display: block;
        }
        h1.article-title {
            font-size: 24px;
            line-height: 1.4;
            margin: 0 0 12px 0;
        }
        .meta {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
        }
        .meta a { color: var(--muted); }
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tag {
            background: var(--quote-bg);
            color: var(--muted);
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 13px;
        }
        .article-body p {
            margin: 0 0 1.5em 0;
            word-break: break-word;
        }
        .article-body h2 {
            font-size: 21px;
            margin: 2em 0 0.8em;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--accent);
        }
        .article-body h3 {
            font-size: 18px;
            margin: 1.6em 0 0.6em;
        }
        .article-body figure {
            margin: 1.8em 0;
            text-align: center;
        }
        .article-body img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }
        .article-body figcaption {
            font-size: 13px;
            color: var(--muted);
            margin-top: 6px;
        }
        .article-body blockquote {
            margin: 1.5em 0;
            padding: 16px 20px;
            background: var(--quote-bg);
            border-left: 4px solid var(--accent);
            border-radius: 0 8px 8px 0;
        }
        .article-body a {
            color: var(--link);
            word-break: break-all;
        }
        .embed-link, .embed-source {
            margin: 12px 0;
            padding: 12px 16px;
            background: var(--quote-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }
        .paywall-warning {
            margin-top: 32px;
            padding: 20px;
            background: #fff3cd;
            color: #664d03;
            border: 1px solid #ffecb5;
            border-radius: 8px;
            text-align: center;
        }
        .footer-nav {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .nav-btn {
            display: inline-block;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            max-width: 48%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

        .nav-btn:hover {
            border-color: var(--accent);
